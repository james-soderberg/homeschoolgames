  <style>
    body { background: var(--cream); }
    .tt-wrap { max-width: 720px; margin: 0 auto; padding: 0.75rem 1rem 2.5rem; text-align: center; }

    /* progress bar of lessons */
    .tt-head { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin: 0.3rem 0 0.2rem; }
    .tt-head .lesson-name { font-family: var(--font-sans); font-weight: 800; font-size: 0.98rem; color: var(--ink); }
    .tt-steps { display: flex; gap: 0.28rem; justify-content: center; margin-bottom: 0.9rem; flex-wrap: wrap; }
    .tt-step { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #ddd0b6; transition: background 0.2s, transform 0.2s; }
    .tt-step.done { background: var(--green); }
    .tt-step.cur { background: var(--gold); transform: scale(1.5); }

    /* the instruction: which finger */
    .tt-instruct { min-height: 2.1rem; font-family: var(--font-sans); font-weight: 700; font-size: 1.15rem; color: var(--ink); margin-bottom: 0.15rem; }
    .tt-instruct b { font-weight: 900; }
    .tt-reach { font-size: 0.9rem; color: var(--ink-light); font-weight: 700; }

    /* the key / word to type */
    .tt-prompt {
      font-family: 'Courier New', ui-monospace, monospace; font-weight: 700;
      font-size: clamp(2.4rem, 12vw, 4.2rem); line-height: 1.1; letter-spacing: 0.06em;
      margin: 0.15rem 0 0.2rem; min-height: 3.4rem; display: flex; align-items: center; justify-content: center; gap: 0.05em;
    }
    .tt-prompt .ch { transition: color 0.12s; color: #c3b79c; padding: 0 0.04em; border-radius: 8px; }
    .tt-prompt .ch.done { color: var(--green); }
    .tt-prompt .ch.cur { color: #2a2005; background: var(--keycol, var(--gold)); box-shadow: 0 4px 0 rgba(0,0,0,0.12); }
    .tt-prompt .ch.space { min-width: 0.5em; }
    .tt-prompt.shake { animation: ttShake 0.2s; }
    @keyframes ttShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

    /* rep dots while learning a key */
    .tt-reps { display: flex; gap: 0.4rem; justify-content: center; min-height: 0.9rem; margin-bottom: 0.4rem; }
    .tt-rep { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: #ddd0b6; transition: background 0.15s, transform 0.15s; }
    .tt-rep.on { background: var(--green); transform: scale(1.15); }

    /* the animated hands */
    .tt-hands { width: 100%; max-width: 560px; margin: 0 auto; display: block; }
    .finger { fill: #f3ddc0; stroke: #d7b487; stroke-width: 2.5; transform-box: fill-box; transform-origin: 50% 88%; transition: fill 0.15s; }
    .palm { fill: #f3ddc0; stroke: #d7b487; stroke-width: 2.5; }
    .finger.act { animation: fingerTap 0.85s ease-in-out infinite; }
    @keyframes fingerTap { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(9px); } }
    .hand-label { font-family: var(--font-sans); font-weight: 800; font-size: 15px; letter-spacing: 0.12em; fill: #a99574; }

    /* completion card */
    .tt-done { background: #fffdf6; border: 2px solid var(--gold); border-radius: 16px; padding: 1.3rem 1.2rem;
      box-shadow: 0 8px 22px rgba(40,25,5,0.16); max-width: 460px; margin: 1rem auto 0; }
    .tt-done .crest { font-size: 2.6rem; line-height: 1; }
    .tt-done h3 { font-family: var(--font-serif); font-size: 1.55rem; margin: 0.15rem 0 0.1rem; color: var(--ink); }
    .tt-done p { color: var(--ink-light); margin: 0 0 1rem; }
    .tt-done .row { display: flex; gap: 1.7rem; justify-content: center; margin-bottom: 1.1rem; }
    .tt-done .row .st b { display: block; font-family: var(--font-sans); font-weight: 900; font-size: 1.7rem; color: var(--ink); line-height: 1; }
    .tt-done .row .st span { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); margin-top: 0.25rem; display: block; }
    .tt-actions { display: flex; gap: 0.55rem; justify-content: center; flex-wrap: wrap; }
    .tt-btn { background: var(--gold); color: #2a2005; border: none; border-radius: 99px; padding: 0.7rem 1.6rem;
      font-family: var(--font-sans); font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #a07f2c;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s; }
    .tt-btn:hover { background: #d0ab48; }
    .tt-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a07f2c; }
    .tt-btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--border); box-shadow: none; }
    .tt-btn.ghost:hover { background: var(--cream-dark); }

    .tt-foot { margin-top: 0.7rem; font-size: 0.8rem; color: var(--ink-light); }
    .tt-foot a { color: var(--ink-light); }
    .tt-lessonjump { margin-top: 0.5rem; }
    .tt-lessonjump select { font-family: var(--font-sans); font-size: 0.82rem; padding: 0.3rem 0.5rem; border-radius: 8px; border: 1.5px solid var(--border); background: #fffdf6; color: var(--ink-light); }
    .hidden { display: none; }

<div class="tt-wrap">

  <div class="tt-head"><span class="lesson-name" id="lessonName">Home Row</span></div>
  <div class="tt-steps" id="steps"></div>

  <div class="tt-instruct" id="instruct">Get ready…</div>
  <div class="tt-prompt" id="prompt"></div>
  <div class="tt-reps" id="reps"></div>

  <svg class="tt-hands" id="hands" viewBox="0 0 560 300" role="img" aria-label="Two hands showing which finger to use"></svg>

  <div class="tt-done hidden" id="doneCard">
    <div class="crest" id="doneCrest">⭐</div>
    <h3 id="doneTitle">Lesson complete!</h3>
    <p id="doneMsg"></p>
    <div class="row">
      <div class="st"><b id="doneAcc">100%</b><span>Accuracy</span></div>
      <div class="st"><b id="doneWpm">0</b><span>WPM</span></div>
    </div>
    <div class="tt-actions">
      <button class="tt-btn" id="nextBtn">Next lesson →</button>
      <button class="tt-btn ghost" id="repeatBtn">Repeat</button>
    </div>

  <div class="tt-lessonjump">
    <label>Jump to a lesson: <select id="lessonJump"></select></label>

  <div class="tt-foot">Keep your fingers on the home row and your eyes on the screen.</div>

</div>

<script src="../../assets/js/sfx.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // finger colors are symmetric: the same finger on both hands shares a color,
  // the way classic touch-typing charts teach it.
  var FCOLOR = { pinky: '#d64550', ring: '#e0913b', middle: '#3b9f5c', index: '#3b7dd8', thumb: '#9b6bcc' };
  var FNAME  = { pinky: 'pinky', ring: 'ring finger', middle: 'middle finger', index: 'index finger', thumb: 'thumb' };

  // key -> [finger, hand]
  var KEYMAP = {
    'q':['pinky','L'],'a':['pinky','L'],'z':['pinky','L'],
    'w':['ring','L'],'s':['ring','L'],'x':['ring','L'],
    'e':['middle','L'],'d':['middle','L'],'c':['middle','L'],
    'r':['index','L'],'f':['index','L'],'v':['index','L'],'t':['index','L'],'g':['index','L'],'b':['index','L'],
    'y':['index','R'],'h':['index','R'],'n':['index','R'],'u':['index','R'],'j':['index','R'],'m':['index','R'],
    'i':['middle','R'],'k':['middle','R'],
    'o':['ring','R'],'l':['ring','R'],
    'p':['pinky','R'],';':['pinky','R'],
    ' ':['thumb','B']
  };
  var TOP = 'qwertyuiop', BOTTOM = 'zxcvbnm';
  function rowOf(k) { k = k.toLowerCase(); return TOP.indexOf(k) >= 0 ? 'top' : (BOTTOM.indexOf(k) >= 0 ? 'bottom' : 'home'); }
  // For a capital letter, the finger is the same as the lowercase key, plus the
  // OPPOSITE-hand pinky holding Shift.
  function info(k) {
    var lower = k.toLowerCase(), m = KEYMAP[lower];
    if (!m) return null;
    var shift = (k !== lower && /[a-z]/.test(lower)) ? (m[1] === 'L' ? 'R' : 'L') : null;
    return { finger: m[0], hand: m[1], key: lower, shift: shift };
  }

  // ---------- lessons: home row first, then every letter, then words ----------
  var LESSONS = [
    { name: 'Home Row: F and J', teach: ['f','j'], test: { count: 12 } },
    { name: 'Home Row: D and K', teach: ['d','k'], test: { count: 12, review: ['f','j'] } },
    { name: 'Home Row: S and L', teach: ['s','l'], test: { count: 12, review: ['f','j','d','k'] } },
    { name: 'Home Row: A and ;', teach: ['a',';'], test: { count: 12, review: ['f','j','d','k','s','l'] } },
    { name: 'Home Row Review', teach: [], test: { count: 18, pool: ['a','s','d','f','j','k','l',';'] } },
    { name: 'Reach: G and H', teach: ['g','h'], test: { count: 12, review: ['a','s','d','f','j','k','l'] } },
    { name: 'Top Row: E and I', teach: ['e','i'], test: { count: 12, review: ['d','k','f','j'] } },
    { name: 'Top Row: R and U', teach: ['r','u'], test: { count: 12, review: ['e','i','f','j'] } },
    { name: 'Top Row: T and Y', teach: ['t','y'], test: { count: 12, review: ['r','u','e','i'] } },
    { name: 'Top Row: W and O', teach: ['w','o'], test: { count: 12, review: ['s','l','e','i'] } },
    { name: 'Top Row: Q and P', teach: ['q','p'], test: { count: 12, review: ['a',';','w','o'] } },
    { name: 'Bottom Row: V B N M', teach: ['v','b','n','m'], test: { count: 14, review: ['f','j'] } },
    { name: 'Bottom Row: C X Z', teach: ['c','x','z'], test: { count: 14, review: ['d','s','a'] } },
    { name: 'Capitals: the Shift Key', teach: ['F','J'], test: { count: 10, pool: ['A','S','D','F','J','K','L'] } },
    { name: 'Real Words', teach: [], test: { words: ['the ','and ','dad ','sun ','cat ','God ','love ','food ','make ','good ','faith ','great ','type ','quick '] } }
  ];

  var PKEY = 'hsg_typing_tutorial';
  function loadProg() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
  function saveProg(p) { try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) {} }
  var prog = loadProg();

  var TEACH_REPS = 4;

  // ---------- state ----------
  var cur = 0, phase = 'teach';
  var teachQueue = [], teachKey = '', reps = 0;
  var prompts = [], pIdx = 0, cPos = 0, correct = 0, wrong = 0, startT = 0;

  // ---------- build the SVG hands ----------
  // Each finger is a capsule; the thumb sits in a rotated group so its tap animates
  // along the thumb's own axis. Fingers are addressed by id (fL_index, fR_pinky, ...).
  var HANDS = {
    L: { palm: [70,170,150,100], thumbRot: [38,214,232],
         fingers: { pinky:[100,120], ring:[132,90], middle:[164,80], index:[196,102] },
         thumb: [206,198] },
    R: { palm: [340,170,150,100], thumbRot: [-38,346,232],
         fingers: { index:[364,102], middle:[396,80], ring:[428,90], pinky:[460,120] },
         thumb: [328,198] }
  };
  function fingerRect(id, cx, top) {
    return '<rect class="finger" id="' + id + '" x="' + (cx-14) + '" y="' + top + '" width="28" height="' + (200-top) + '" rx="14"/>';
  }
  function buildHands() {
    var s = '';
    ['L','R'].forEach(function (h) {
      var H = HANDS[h];
      s += '<rect class="palm" x="' + H.palm[0] + '" y="' + H.palm[1] + '" width="' + H.palm[2] + '" height="' + H.palm[3] + '" rx="46"/>';
      for (var f in H.fingers) s += fingerRect('f' + h + '_' + f, H.fingers[f][0], H.fingers[f][1]);
      // thumb inside a rotated group
      s += '<g transform="rotate(' + H.thumbRot[0] + ' ' + H.thumbRot[1] + ' ' + H.thumbRot[2] + ')">' +
           '<rect class="finger" id="f' + h + '_thumb" x="' + (H.thumb[0]-14) + '" y="' + H.thumb[1] + '" width="28" height="66" rx="14"/></g>';
      // hand label
      var lx = h === 'L' ? 145 : 415;
      s += '<text class="hand-label" x="' + lx + '" y="292" text-anchor="middle">' + (h === 'L' ? 'LEFT' : 'RIGHT') + '</text>';
    });
    $('hands').innerHTML = s;
  }
  function clearFingers() {
    var els = $('hands').querySelectorAll('.finger');
    for (var i = 0; i < els.length; i++) { els[i].classList.remove('act'); els[i].style.fill = ''; }
  }
  function activeFinger(k) {
    clearFingers();
    var nfo = info(k); if (!nfo) return;
    var color = FCOLOR[nfo.finger];
    document.documentElement.style.setProperty('--keycol', color);
    if (nfo.hand === 'B') {  // space: both thumbs
      ['fL_thumb','fR_thumb'].forEach(function (id) { var e = $(id); if (e) { e.classList.add('act'); e.style.fill = color; } });
      return;
    }
    var el = $('f' + nfo.hand + '_' + nfo.finger);
    if (el) { el.classList.add('act'); el.style.fill = color; }
    if (nfo.shift) { var sp = $('f' + nfo.shift + '_pinky'); if (sp) { sp.classList.add('act'); sp.style.fill = FCOLOR.pinky; } }
  }

  // ---------- rendering ----------
  function renderSteps() {
    // steps = teach keys (one dot each) + one dot for the test
    var L = LESSONS[cur];
    var totalTeach = L.teach.length;
    var host = $('steps'); host.innerHTML = '';
    for (var i = 0; i < totalTeach; i++) {
      var d = document.createElement('span'); d.className = 'tt-step';
      if (phase === 'teach') { var doneCount = totalTeach - teachQueue.length - 1; if (i < doneCount) d.className += ' done'; else if (i === doneCount) d.className += ' cur'; }
      else d.className += ' done';
      host.appendChild(d);
    }
    var t = document.createElement('span'); t.className = 'tt-step' + (phase === 'test' ? ' cur' : '');
    host.appendChild(t);
  }

  function renderPrompt(str, pos) {
    var html = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      var disp = ch === ' ' ? '␣' : ch;
      var cls = i < pos ? 'done' : (i === pos ? 'cur' : '');
      html += '<span class="ch ' + cls + (ch === ' ' ? ' space' : '') + '">' + disp + '</span>';
    }
    $('prompt').innerHTML = html;
  }

  function instructFor(k) {
    var nfo = info(k);
    if (!nfo) return '';
    if (nfo.hand === 'B') return 'Tap the <b>space bar</b> with a <b>thumb</b>.';
    var hand = nfo.hand === 'L' ? 'left' : 'right';
    var base = 'Use your <b>' + hand + ' ' + FNAME[nfo.finger] + '</b>.';
    if (nfo.shift) {
      var sh = nfo.shift === 'L' ? 'left' : 'right';
      return base + '<br><span class="tt-reach">hold the ' + sh + ' <b>Shift</b> with your pinky</span>';
    }
    var reach = '', r = rowOf(k), kl = k.toLowerCase();
    if (r === 'top') reach = 'reach up, then back to home';
    else if (r === 'bottom') reach = 'reach down, then back to home';
    else if (kl === 'g' || kl === 'h') reach = 'reach inward, then back to home';
    return base + (reach ? '<br><span class="tt-reach">' + reach + '</span>' : '');
  }

  // ---------- teach phase ----------
  function startTeach() {
    phase = 'teach';
    teachQueue = LESSONS[cur].teach.slice();
    if (!teachQueue.length) { startTest(); return; }
    nextTeachKey();
  }
  function nextTeachKey() {
    if (!teachQueue.length) { startTest(); return; }
    teachKey = teachQueue.shift();
    reps = 0;
    $('instruct').innerHTML = instructFor(teachKey) ;
    renderPrompt(teachKey === ' ' ? ' ' : teachKey, 0);
    activeFinger(teachKey);
    renderReps();
    renderSteps();
  }
  function renderReps() {
    var host = $('reps'); host.innerHTML = '';
    for (var i = 0; i < TEACH_REPS; i++) { var d = document.createElement('span'); d.className = 'tt-rep' + (i < reps ? ' on' : ''); host.appendChild(d); }
  }

  // ---------- test phase ----------
  function buildTest() {
    var L = LESSONS[cur], t = L.test;
    if (t.words) { return t.words.slice(); }
    var pool = t.pool || L.teach.slice();
    var review = t.review || [];
    var out = [], last = '';
    for (var i = 0; i < (t.count || 12); i++) {
      var src = (review.length && Math.random() < 0.3) ? review : pool;
      var k, guard = 0;
      do { k = src[Math.floor(Math.random() * src.length)]; guard++; } while (k === last && guard < 8);
      last = k; out.push(k);
    }
    return out;
  }
  function startTest() {
    phase = 'test';
    prompts = buildTest();
    pIdx = 0; cPos = 0; correct = 0; wrong = 0; startT = 0;
    $('reps').innerHTML = '';
    renderSteps();
    showTestPrompt();
  }
  function showTestPrompt() {
    var p = prompts[pIdx];
    renderPrompt(p, cPos);
    var k = p[cPos];
    $('instruct').innerHTML = instructFor(k);
    activeFinger(k);
  }

  // ---------- completion ----------
  function finishLesson() {
    var total = correct + wrong, acc = total ? Math.round(correct / total * 100) : 100;
    var mins = startT ? (Date.now() - startT) / 60000 : 0;
    var wpm = mins > 0 ? Math.round((correct / 5) / mins) : 0;
    var prev = prog[cur] || {};
    prog[cur] = { done: true, acc: Math.max(prev.acc || 0, acc), wpm: Math.max(prev.wpm || 0, wpm) };
    saveProg(prog);
    $('doneAcc').textContent = acc + '%';
    $('doneWpm').textContent = wpm;
    $('doneCrest').textContent = acc >= 98 ? '🌟' : acc >= 90 ? '⭐' : '✅';
    $('doneTitle').textContent = acc >= 98 ? 'Perfect fingers!' : 'Lesson complete!';
    var isLast = cur >= LESSONS.length - 1;
    $('doneMsg').textContent = isLast ? 'You have practiced every letter. Now put it to work in a typing game!' : 'Nice work. Ready for the next set of keys?';
    $('nextBtn').textContent = isLast ? 'Play a typing game →' : 'Next lesson →';
    clearFingers();
    $('doneCard').classList.remove('hidden');
    buildJump();
  }

  // ---------- input ----------
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('doneCard').classList.contains('hidden')) return;   // waiting on the done card
    var k = e.key;
    if (k === 'Tab') { e.preventDefault(); return; }
    if (k.length !== 1) return;      // ignore Shift/Enter/Arrows/etc.
    var expected = (phase === 'teach') ? teachKey : prompts[pIdx][cPos];
    e.preventDefault();

    if (k === expected) {
      if (window.HSGSound && HSGSound.tick) HSGSound.tick();
      // one crisp tap on the active finger
      var nfo = info(expected);
      if (nfo) {
        var ids = nfo.hand === 'B' ? ['fL_thumb','fR_thumb'] : ['f' + nfo.hand + '_' + nfo.finger];
        ids.forEach(function (id) { var el = $(id); if (el) { el.classList.remove('act'); void el.offsetWidth; el.classList.add('act'); } });
      }
      if (phase === 'teach') {
        reps++; renderReps();
        if (reps >= TEACH_REPS) { setTimeout(nextTeachKey, 260); }
      } else {
        if (!startT) startT = Date.now();
        correct++;
        cPos++;
        if (cPos >= prompts[pIdx].length) { pIdx++; cPos = 0; if (pIdx >= prompts.length) { finishLesson(); return; } }
        showTestPrompt();
      }
    } else {
      if (phase === 'test') wrong++;
      var box = $('prompt'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      if (window.HSGSound && HSGSound.wrong) HSGSound.wrong();
    }
  });

  // ---------- lifecycle ----------
  function loadLesson(i) {
    cur = i;
    $('lessonName').textContent = LESSONS[i].name;
    $('doneCard').classList.add('hidden');
    startTeach();
    buildJump();
  }
  function buildJump() {
    var sel = $('lessonJump'); sel.innerHTML = '';
    LESSONS.forEach(function (L, i) {
      var o = document.createElement('option'); o.value = i;
      o.textContent = (prog[i] && prog[i].done ? '✓ ' : '') + (i + 1) + '. ' + L.name;
      if (i === cur) o.selected = true;
      sel.appendChild(o);
    });
  }
  $('lessonJump').addEventListener('change', function () { loadLesson(parseInt(this.value, 10)); });
  $('nextBtn').addEventListener('click', function () {
    if (cur < LESSONS.length - 1) loadLesson(cur + 1);
    else location.href = '../word-racer/index.html';
  });
  $('repeatBtn').addEventListener('click', function () { loadLesson(cur); });

  // ---------- go ----------
  buildHands();
  var jump = null;
  try { var q = new URLSearchParams(location.search).get('lesson'); if (q != null) jump = parseInt(q, 10); } catch (e) {}
  var start;
  if (jump != null && !isNaN(jump)) start = Math.max(0, Math.min(LESSONS.length - 1, jump));
  else { start = 0; while (start < LESSONS.length - 1 && prog[start] && prog[start].done) start++; }
  loadLesson(start);
})();
</script>
