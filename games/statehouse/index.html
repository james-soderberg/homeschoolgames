    .float-prompt.show { opacity: 0.96; }

    .float-prompt b { color: #f0d384; font-family: var(--font-serif); font-weight: 800; }
    #fpBottom { left: 50%; bottom: 16px; transform: translateX(-50%); padding: .55rem 1.2rem; font-size: 1.1rem; }

<script>
// ============================================================
// STATEHOUSE - a US states & capitals quiz. Two modes:
//   states   -> "Find Ohio"                     -> click the state
//   capitals -> "Find the state: Columbus"      -> click the state
// Geometry (geoAlbersUsa, AK/HI insets) lives in ./us-states.js.
// Mirrors Map Quiz: a fresh full run of all 50 states each time, an
// accuracy-based mapscore, and per-mode global leaderboards.
// ============================================================
const US = window.HSG_US_DATA;
const STATES = Object.keys(US.paths);            // 50 USPS codes
const NAME = code => US.meta[code].name;
const CAPITAL = code => US.meta[code].capital;

const MODES = {
  states:   { label: 'Find the States',    emoji: '🗺️', sub: 'Click each state', promptLabel: 'Click this state on the map →', promptFind: 'Find' },
  capitals: { label: 'Match the Capitals', emoji: '🏛️', sub: 'State of each capital', promptLabel: "Click the state whose capital this is →", promptFind: 'Capital' },
};
const MODE_ORDER = ['states', 'capitals'];

function buildUSMap(interactive) {
  let svg = `<svg viewBox="${US.viewBox}" xmlns="http://www.w3.org/2000/svg" class="us-svg">`;
  for (const [id, d] of Object.entries(US.paths)) {
    svg += interactive
      ? `<path id="${id}" class="state" d="${d}"></path>`
      : `<path class="prev" d="${d}"></path>`;
  }
  svg += `</svg>`;
  return svg;
}

// ---- State ----
let currentMode = null;
let queue = [];
let currentState = null;      // USPS code being asked
let completed = new Set();
let runCorrect = 0, runWrong = 0, streak = 0;
let waitingForNext = false, advanceTimer = null, modeJustFinished = false;

// mapscore: more correct wins, ties broken by fewer wrong (see streak-rail unit).
function encodeScore(correct, wrong) { return correct * 1000 + (999 - Math.min(wrong, 999)); }

// ---- found-state colours: a stable, varied hue per state ----
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function colorFor(id) { const hue = hashStr(id) % 360; return { fill: `hsl(${hue}, 52%, 62%)`, stroke: `hsl(${hue}, 45%, 37%)` }; }
function paintCompleted(el, id) { if (!el) return; const c = colorFor(id); el.style.fill = c.fill; el.style.stroke = c.stroke; el.style.strokeWidth = '0.7'; }
function setTitle(el, name) {
  if (!el) return;
  let t = el.querySelector('title');
  if (!t) { t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); el.appendChild(t); }
  t.textContent = name;
}

// ---- prompt (top box + floating chip) ----
function setPrompt(code) {
  const m = MODES[currentMode];
  document.getElementById('promptLabel').textContent = m.promptLabel;
  const pc = document.getElementById('promptCountry');
  const fp = document.getElementById('fpBottom');
  if (!code) {                     // completion message
    pc.textContent = 'All found! 🎉';
    if (fp) fp.classList.remove('show');
    return;
  }
  if (currentMode === 'capitals') {
    pc.innerHTML = CAPITAL(code) + '<span class="cap-sub">which state?</span>';
    if (fp) { fp.innerHTML = '<span class="lbl">Capital:</span> <b>' + CAPITAL(code) + '</b>'; fp.classList.add('show'); }
  } else {
    pc.textContent = NAME(code);
    if (fp) { fp.innerHTML = '<span class="lbl">Find:</span> <b>' + NAME(code) + '</b>'; fp.classList.add('show'); }
  }
}

// ---- screen switching ----
function showPicker() {
  clearTimeout(advanceTimer); waitingForNext = false; currentState = null;
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('modePicker').style.display = '';
  const fp = document.getElementById('fpBottom'); if (fp) fp.classList.remove('show');
  renderPickerBoards();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function enterMode(mode) {
  currentMode = mode;
  document.getElementById('modePicker').style.display = 'none';
  document.getElementById('gameScreen').style.display = '';
  loadMode(mode);
  renderModeBoard();
}
function loadMode(mode) {
  currentMode = mode;
  document.getElementById('mapContainer').innerHTML = buildUSMap(true);
  document.querySelectorAll('#mapContainer .state').forEach(p => p.addEventListener('click', () => handleStateClick(p.id)));
  startRound();
}
function startRound() {
  completed = new Set();
  runCorrect = 0; runWrong = 0; streak = 0; modeJustFinished = false;
  queue = shuffle(STATES.slice());
  updateScoreDisplay();
  nextQuestion();
}
function restartMode() { clearTimeout(advanceTimer); loadMode(currentMode); }

// ---- leaderboard (per mode, accuracy-based) ----
function renderModeBoard() {
  const host = document.getElementById('streakRail');
  if (!host || !currentMode) return;
  host.innerHTML = '<div class="sh-board-mode">' + MODES[currentMode].label + ' · Top scores</div><div id="shRailBoard"></div>';
  HSGStreak.renderBoardInto('#shRailBoard', { gameId: 'statehouse', level: currentMode, minStreak: 1, unit: 'mapscore' });
}

// Start screen: one homepage-style card per mode, live from /api/top.
const shLive = {};
function renderPickerBoards() {
  const host = document.getElementById('streakRail');
  if (!host) return;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const MEDAL = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const fmt = s => (window.HSGStreak && HSGStreak.formatScore) ? HSGStreak.formatScore('mapscore', s) : String(s);
  const keyFor = m => 'hsg_lb_statehouse__' + m;
  const readCache = m => {
    try {
      const list = JSON.parse(localStorage.getItem(keyFor(m)) || '[]');
      return Array.isArray(list) ? list.filter(e => e && typeof e.name === 'string' && typeof e.score === 'number')
        .sort((a, b) => (b.score - a.score) || ((a.ts || 0) - (b.ts || 0))) : [];
    } catch (e) { return []; }
  };
  const rowsFor = m => shLive[m] || readCache(m);
  function cardHTML(m) {
    const meta = MODES[m], rows = rowsFor(m);
    const body = rows.length
      ? '<ol class="lb-card-list">' + rows.slice(0, 5).map((e, i) =>
          '<li class="lb-card-row"><span class="lb-card-rank">' + (MEDAL[i + 1] || (i + 1)) + '</span>' +
          '<span class="lb-card-name">' + esc(e.name) + '</span>' +
          '<span class="lb-card-score">' + esc(fmt(e.score)) + '</span></li>').join('') + '</ol>'
      : '<p class="lb-empty">No scores yet. Be the first!</p>';
    return '<div class="lb-card sh-mode-card" data-mode="' + m + '">' +
      '<div class="lb-card-head"><span class="lb-card-emoji">' + meta.emoji + '</span>' +
      '<span class="lb-card-titles"><span class="lb-card-game">' + esc(meta.label) + '</span>' +
      '<span class="lb-card-level">50 states</span></span></div>' + body + '</div>';
  }
  function paint() {
    host.innerHTML = '<div class="lb-rail sh-picker-rail">' +
      '<div class="lb-rail-title">🏆 Top Scores</div>' +
      MODE_ORDER.map(cardHTML).join('') + '</div>';
    host.querySelectorAll('.sh-mode-card').forEach(el => el.addEventListener('click', () => enterMode(el.dataset.mode)));
  }
  paint();
  if (typeof fetch === 'function' && /^https?:$/.test(location.protocol)) {
    MODE_ORDER.forEach(m => {
      fetch('/api/top?board=' + encodeURIComponent(keyFor(m)))
        .then(x => x.ok ? x.json() : null)
        .then(list => { if (Array.isArray(list)) { shLive[m] = list; paint(); } })
        .catch(() => {});
    });
  }
}

function bankRun(onDone) {
  if (runCorrect <= 0) { if (onDone) onDone(); return; }
  HSGStreak.record({
    gameId: 'statehouse', gameName: 'Statehouse',
    level: currentMode, levelName: MODES[currentMode].label,
    unit: 'mapscore', minStreak: 1, score: encodeScore(runCorrect, runWrong),
    onDone: () => { renderModeBoard(); if (onDone) onDone(); }
  });
}
function quitAndSave() {
  clearTimeout(advanceTimer); waitingForNext = false; currentState = null;
  bankRun(showPicker);
}

function nextQuestion() {
  clearTimeout(advanceTimer);
  waitingForNext = false;
  document.getElementById('feedbackBar').textContent = '';
  document.querySelectorAll('#mapContainer .state').forEach(el => el.classList.remove('correct-flash', 'wrong-flash', 'show-correct'));

  if (queue.length === 0) {
    currentState = null;
    setPrompt(null);
    const totalGuesses = runCorrect + runWrong;
    const pct = totalGuesses ? Math.round(100 * runCorrect / totalGuesses) : 100;
    document.getElementById('feedbackBar').innerHTML =
      `<span class="feedback-correct">🇺🇸 You finished all 50 states! ${pct}% accuracy.</span>`;
    if (modeJustFinished) {
      modeJustFinished = false;
      if (window.HSGfx) HSGfx.confetti({ count: 90, big: true });
      if (window.HSGfx && HSGfx.showSummary) HSGfx.showSummary({
        title: `${MODES[currentMode].label} complete!`,
        correct: runCorrect, total: totalGuesses,
        stats: [
          { num: runCorrect, label: 'Found' },
          { num: totalGuesses, label: 'Guesses' },
          { num: pct, label: '% Accuracy', cls: 'best' },
        ],
        extraHTML: '<div id="shBoard" style="text-align:left;margin:0.25rem 0 0.5rem"></div>',
        onMount: card => HSGStreak.endPanel(card.querySelector('#shBoard'), {
          gameId: 'statehouse', gameName: 'Statehouse', level: currentMode, levelName: MODES[currentMode].label,
          unit: 'mapscore', score: encodeScore(runCorrect, runWrong), minStreak: 1,
          onSaved: () => renderModeBoard(),
        }),
        onPlayAgain: () => enterMode(currentMode),
      });
    }
    return;
  }

  currentState = queue.pop();
  setPrompt(currentState);
}

function handleStateClick(id) {
  if (waitingForNext) { nextQuestion(); return; }
  if (!currentState) return;
  if (completed.has(id)) return;

  const fb = document.getElementById('feedbackBar');
  const correctEl = document.getElementById(currentState);
  const capMode = currentMode === 'capitals';

  if (id === currentState) {
    runCorrect++; streak++;
    if (window.HSGSound) HSGSound.correct();
    if (window.HSGfx && HSGfx.milestone(streak) && window.HSGSound) HSGSound.streak(streak);
    completed.add(currentState);
    if (completed.size === STATES.length) modeJustFinished = true;
    if (correctEl) {
      correctEl.classList.add('correct-flash', 'completed');
      setTitle(correctEl, NAME(currentState));
      paintCompleted(correctEl, currentState);
      const fid = currentState;
      setTimeout(() => { const e = document.getElementById(fid); if (e) e.classList.remove('correct-flash'); }, 450);
    }
    fb.innerHTML = capMode
      ? `<span class="feedback-correct">🎉 Yes! ${CAPITAL(currentState)} is the capital of ${NAME(currentState)}!</span>`
      : `<span class="feedback-correct">🎉 Yes! That's ${NAME(currentState)}!</span>`;
    updateScoreDisplay();
    waitingForNext = true;
    advanceTimer = setTimeout(nextQuestion, 1000);
  } else {
    runWrong++; streak = 0;
    if (window.HSGSound) HSGSound.wrong();
    const clicked = NAME(id);
    fb.innerHTML = capMode
      ? `<span class="feedback-wrong">✗ That's ${clicked} (capital ${CAPITAL(id)}). ${CAPITAL(currentState)} is the capital of ${NAME(currentState)}, shown in green.</span>`
      : `<span class="feedback-wrong">✗ That's ${clicked}. ${NAME(currentState)} is highlighted in green.</span>`;
    if (correctEl) correctEl.classList.add('show-correct');
    const wrongEl = document.getElementById(id);
    if (wrongEl) { wrongEl.classList.add('wrong-flash'); setTimeout(() => wrongEl.classList.remove('wrong-flash'), 800); }
    const at = Math.floor(Math.random() * (queue.length + 1));
    queue.splice(at, 0, currentState);          // put it back for another try
    updateScoreDisplay();
    waitingForNext = true;
    advanceTimer = setTimeout(nextQuestion, 2000);
  }
}

function updateScoreDisplay() {
  document.getElementById('scoreCorrect').textContent = `${runCorrect} / ${STATES.length}`;
  document.getElementById('scoreWrong').textContent = runWrong;
  const g = runCorrect + runWrong;
  document.getElementById('scoreAcc').textContent = g ? Math.round(100 * runCorrect / g) + '%' : '—';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// ============================================================
// Init
// ============================================================
document.getElementById('usMapWrap').innerHTML = buildUSMap(false);
(function buildModeCards() {
  const host = document.getElementById('modeCards');
  MODE_ORDER.forEach(m => {
    const meta = MODES[m];
    const card = document.createElement('button');
    card.className = 'mode-card'; card.dataset.mode = m;
    card.innerHTML = '<span class="mc-emoji">' + meta.emoji + '</span><span style="text-align:left"><span class="mc-name">' + meta.label + '</span><br><span class="mc-sub">' + meta.sub + '</span></span>';
    card.addEventListener('click', () => enterMode(m));
    host.appendChild(card);
  });
})();

// Hover a found state to see its name.
const mapTip = document.createElement('div');
mapTip.id = 'mapTip'; document.body.appendChild(mapTip);
const fpBottom = document.createElement('div');
fpBottom.id = 'fpBottom'; fpBottom.className = 'float-prompt'; document.body.appendChild(fpBottom);
const mapContainerEl = document.getElementById('mapContainer');
function hideTip() { mapTip.classList.remove('show'); }
mapContainerEl.addEventListener('mousemove', (e) => {
  // Capitals mode: the answer is the state, so hovering ANY state names it (a study
  // aid). States mode: only already-found states are named, so hovering never gives
  // away the state you're being asked to find.
  const sel = currentMode === 'capitals' ? '.state' : '.state.completed';
  const path = e.target.closest ? e.target.closest(sel) : null;
  const name = path ? NAME(path.id) : null;
  if (name) { mapTip.textContent = name; mapTip.style.left = e.clientX + 'px'; mapTip.style.top = e.clientY + 'px'; mapTip.classList.add('show'); }
  else hideTip();
});
mapContainerEl.addEventListener('mouseleave', hideTip);

// Deep link straight into a mode, e.g. ?m=capitals.
const mq = new URLSearchParams(location.search).get('m');
if (mq && MODES[mq]) enterMode(mq);
else renderPickerBoards();
</script>
